services:
  - type: web
    name: onyx-bot
    env: node
    buildCommand: npm install --prefer-offline
    startCommand: node index.js
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
    autoDeploy: true
